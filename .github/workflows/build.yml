name: Gerar APK e Site

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar arquivos do Android
        run: |
          flutter create --platforms=android --project-name meus_leads --org br.com.meusleads .
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="Meus Leads"|' android/app/src/main/AndroidManifest.xml

      - name: Desativar a verificação lint do release
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/sem-lint.gradle <<'EOF'
          allprojects {
            tasks.configureEach { task ->
              if (task.name.startsWith("lintVital")) { task.enabled = false }
            }
          }
          EOF

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: meus-leads-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar arquivos da web
        run: |
          flutter create --platforms=web --project-name meus_leads --org br.com.meusleads .
          sed -i 's|<title>.*</title>|<title>Meus Leads</title>|' web/index.html

      - run: flutter pub get

      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deploy
        uses: actions/deploy-pages@v4
